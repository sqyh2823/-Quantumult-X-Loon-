# Mihomo / Clash Meta - Android TV 稳定优先版
# 注意：本文件含节点凭据，请勿上传到公开 GitHub 仓库。

mixed-port: 7890
allow-lan: false  # 电视自己使用代理，无需向局域网开放混合代理端口
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

# DNS 劫持属于 tun 配置，不属于 dns 配置。
# 安卓/电视端请由客户端的 VPN/TUN 功能接管流量和 DNS。
dns:
  enable: true
  listen: 127.0.0.1:1053  # 仅供电视本机 DNS 使用；如设备客户端有兼容性问题，可恢复 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  prefer-h3: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 代理服务器本身若使用域名，使用国内 DNS 引导解析。
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 国外 DNS 使用 DoH，并遵从路由规则（通常通过代理）。
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  # 国内站点及专用域名使用国内 DNS，避免国内业务走海外解析。
  nameserver-policy:
    'geosite:cn,private':
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    '+.cn':
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    '+.06231104.xyz':
      - 223.5.5.5
      - 119.29.29.29
  # 本地服务及大陆域名不分配 Fake-IP。
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - geosite:private
    - geosite:cn
    - '+.lan'
    - '+.local'
    - '+.home.arpa'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - '+.ntp.org'

