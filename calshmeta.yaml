# ==================== 规则 ====================
rules:
  # 🚫 斩断已知 DoH 逃生管道
  - DOMAIN-SUFFIX,dns.google,REJECT
  - DOMAIN-SUFFIX,cloudflare-dns.com,REJECT
  - DOMAIN-SUFFIX,dns.quad9.net,REJECT
  - DOMAIN-SUFFIX,adguard-dns.com,REJECT

  # 🚫 核心优化：封锁 QUIC (UDP 443)，强迫电视端 Disney+/YouTube 走稳定的 TCP 协议
  - AND,((DST-PORT,443),(NETWORK,UDP)),REJECT

  # 🎥 Netflix 域名强锁
  - DOMAIN-KEYWORD,netflix,🎥 奈飞分流
  - DOMAIN-SUFFIX,netflix.com,🎥 奈飞分流
