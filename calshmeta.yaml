# 默认选择“自动测速”；如需固定地区/节点可手动指定。
# 流媒体策略组默认台湾出口，避免频繁自动换区。
proxy-groups:
  - name: '♻️ 自动测速'
    type: url-test
    proxies:
      - '台湾vless'
      - '香港hy2'
      - '美国vless'
      - '美国hy2'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80
    lazy: true

  - name: '🚀 自动选择'
    type: select
    proxies:
      - '♻️ 自动测速'
      - '台湾vless'
      - '香港hy2'
      - '美国vless'
      - '美国hy2'

  - name: '🎥 奈飞分流'
    type: select
    proxies:
      - '台湾vless'
      - '美国vless'
      - '美国hy2'
      - '香港hy2'

  - name: '🏰 迪士尼分流'
    type: select
    proxies:
      - '台湾vless'
      - '美国vless'
      - '美国hy2'
      - '香港hy2'

  - name: '🔴 YouTube分流'
    type: select
    proxies:
      - '台湾vless'
      - '香港hy2'
      - '美国vless'
      - '美国hy2'

rules:
  # 私有网络设备直连，避免局域网设备、投屏等经代理。
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - GEOSITE,private,DIRECT

  # 对已知公共 DoH 域名的阻断（不等于能阻断全部加密 DNS）。
  - DOMAIN-SUFFIX,dns.google,REJECT
  - DOMAIN-SUFFIX,cloudflare-dns.com,REJECT
  - DOMAIN-SUFFIX,dns.quad9.net,REJECT
  - DOMAIN-SUFFIX,adguard-dns.com,REJECT

  # 电视稳定版默认保留应用 QUIC / HTTP3；只有遇到 YouTube/Disney+ 明确的 QUIC 卡顿时再测试下行。
  # 启用下行可禁止客户端 UDP/443（不会禁用 Hysteria2 节点自己的 UDP 传输），但可能拖慢应用回退。
  # - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT

  # Netflix：播放器、图片、测速等域名。
  - DOMAIN-KEYWORD,netflix,🎥 奈飞分流
  - DOMAIN-SUFFIX,netflix.com,🎥 奈飞分流
  - DOMAIN-SUFFIX,netflix.net,🎥 奈飞分流
  - DOMAIN-SUFFIX,nflxext.com,🎥 奈飞分流
  - DOMAIN-SUFFIX,nflxso.net,🎥 奈飞分流
  - DOMAIN-SUFFIX,nflximg.net,🎥 奈飞分流
  - DOMAIN-SUFFIX,nflxvideo.net,🎥 奈飞分流
  - DOMAIN-KEYWORD,netflixdnstest,🎥 奈飞分流
  - GEOSITE,netflix,🎥 奈飞分流

  # Disney+：授权、播放器和 CDN。
  - DOMAIN-KEYWORD,disney,🏰 迪士尼分流
  - DOMAIN-KEYWORD,bamgrid,🏰 迪士尼分流
  - DOMAIN-SUFFIX,disneyplus.com,🏰 迪士尼分流
  - DOMAIN-SUFFIX,disneystreaming.com,🏰 迪士尼分流
  - DOMAIN-SUFFIX,bamgrid.com,🏰 迪士尼分流
  - DOMAIN-SUFFIX,bamtechmedia.com,🏰 迪士尼分流
  - DOMAIN-SUFFIX,dssott.com,🏰 迪士尼分流
  - DOMAIN-SUFFIX,starott.com,🏰 迪士尼分流
  - GEOSITE,disney,🏰 迪士尼分流

  # YouTube：视频流、缩略图、API 等。
  - DOMAIN-KEYWORD,youtube,🔴 YouTube分流
  - DOMAIN-SUFFIX,youtu.be,🔴 YouTube分流
  - DOMAIN-SUFFIX,googlevideo.com,🔴 YouTube分流
  - DOMAIN-SUFFIX,ytimg.com,🔴 YouTube分流
  - DOMAIN-SUFFIX,youtubei.googleapis.com,🔴 YouTube分流
  - GEOSITE,youtube,🔴 YouTube分流

  # 单独站点不归入 YouTube 区域出口。
  - DOMAIN-SUFFIX,micu.hk,🚀 自动选择

  # AI 服务。
  - DOMAIN-SUFFIX,openai.com,🚀 自动选择
  - DOMAIN-SUFFIX,chatgpt.com,🚀 自动选择
  - DOMAIN-SUFFIX,oaistatic.com,🚀 自动选择
  - DOMAIN-SUFFIX,oaiusercontent.com,🚀 自动选择
  - DOMAIN-SUFFIX,anthropic.com,🚀 自动选择
